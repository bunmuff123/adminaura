<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Admin PinkAura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#7a1e4a;
  --maroon-dark:#4f1230;
  --maroon-light:#9c2c60;
  --pink:#ec1e79;
  --pink-soft:#ffd9e8;
  --cream:#fdf1ee;
  --card:#ffffff;
  --text:#2b1220;
  --muted:#8a7580;
  --line:#f0dfe4;
  --good:#1e9e6b;
  --warn:#e08a1f;
  --shadow: 0 10px 30px -12px rgba(122,30,74,.25);
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Poppins',sans-serif;background:var(--cream);color:var(--text);}
h1,h2,h3,.brand{font-family:'Playfair Display',serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{text-decoration:none;color:inherit;}
::selection{background:var(--pink-soft);}

/* ---------- LOGIN ---------- */
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 20% 20%, var(--maroon-light), var(--maroon-dark) 70%);
  padding:24px;
}
.login-card{
  background:var(--card);width:100%;max-width:380px;border-radius:20px;
  padding:36px 32px;box-shadow:var(--shadow);text-align:center;
  animation:riseIn .5s ease;
}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.login-card .logo{font-size:30px;font-weight:800;color:var(--maroon);margin-bottom:2px;}
.login-card .logo span{color:var(--pink);}
.login-card p.sub{color:var(--muted);font-size:13px;margin-top:0;margin-bottom:24px;}
.field{text-align:left;margin-bottom:16px;}
.field label{font-size:12px;font-weight:600;color:var(--maroon-dark);display:block;margin-bottom:6px;}
.field input{
  width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:#fffaf9;font-size:14px;outline:none;transition:.2s;
}
.field input:focus{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft);}
.btn-primary{
  width:100%;padding:13px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--pink),var(--maroon));color:#fff;
  font-weight:600;font-size:14px;letter-spacing:.3px;box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease;
}
.btn-primary:hover{transform:translateY(-2px);}
.login-hint{margin-top:18px;font-size:11.5px;color:var(--muted);background:var(--pink-soft);padding:8px 10px;border-radius:10px;}
.shake{animation:shake .4s;}
@keyframes shake{
  10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}
}
.login-error{color:#c81e5c;font-size:12.5px;height:16px;margin-top:-6px;margin-bottom:10px;}

/* ---------- APP SHELL ---------- */
.top-header{
  position:fixed;top:0;left:0;right:0;z-index:60;
  background:linear-gradient(135deg,var(--maroon-dark),var(--maroon));
  color:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 4px 16px rgba(45,10,26,.25);
}
.top-header .th-brand{font-size:19px;font-weight:800;margin:0;letter-spacing:.2px;}
.top-header .th-brand span{color:var(--pink-soft);}
.top-header .th-role{font-size:10.5px;opacity:.75;letter-spacing:.4px;text-transform:uppercase;margin-top:1px;}
.logout-icon{
  background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;
  border-radius:50%;font-size:15px;display:flex;align-items:center;justify-content:center;
  transition:.2s;flex-shrink:0;
}
.logout-icon:hover{background:rgba(255,255,255,.3);}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -10px 24px -14px rgba(122,30,74,.35);
}
.bn-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 12px;border-radius:14px;color:var(--muted);
  font-size:10.5px;font-weight:600;cursor:pointer;transition:.18s;
  min-width:66px;user-select:none;
}
.bn-item .bn-icon{font-size:20px;transition:.18s;}
.bn-item:hover{background:var(--pink-soft);}
.bn-item.active{color:var(--pink);}
.bn-item.active .bn-icon{transform:translateY(-2px) scale(1.05);}

.main{padding:88px 24px 96px;max-width:1080px;margin:0 auto;animation:fadeUp .35s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
.topbar h1{font-size:24px;margin:0;color:var(--maroon-dark);}
.topbar .date{font-size:12.5px;color:var(--muted);}

/* dashboard cards */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:28px;}
.stat-card{background:var(--card);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.stat-card .icon{font-size:20px;background:var(--pink-soft);width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.stat-card .num{font-size:26px;font-weight:700;color:var(--maroon-dark);}
.stat-card .lbl{font-size:12.5px;color:var(--muted);margin-top:2px;}
.stat-card .trend{font-size:11.5px;font-weight:600;margin-top:8px;}
.trend.up{color:var(--good);}

.panel{background:var(--card);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:22px;}
.panel h3{margin:0 0 16px;font-size:16px;color:var(--maroon-dark);}
.activity-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px;gap:10px;}
.activity-row:last-child{border-bottom:none;}
.activity-row .tag{background:var(--pink-soft);color:var(--maroon-dark);font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap;}

/* forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-grid .full{grid-column:1/-1;}
.form-grid label{font-size:12.5px;font-weight:600;color:var(--maroon-dark);display:block;margin-bottom:6px;}
.form-grid input, .form-grid select, .form-grid textarea{
  width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);
  background:#fffaf9;font-size:13.5px;outline:none;transition:.2s;
}
.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft);}
.btn-submit{
  margin-top:20px;padding:12px 26px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--pink),var(--maroon));color:#fff;font-weight:600;
  font-size:13.5px;box-shadow:var(--shadow);transition:.15s;
}
.btn-submit:hover{transform:translateY(-2px);}

/* table */
.table-tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
.search-box{flex:1;max-width:280px;padding:10px 14px;border-radius:11px;border:1.5px solid var(--line);font-size:13px;background:#fffaf9;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:2px solid var(--line);}
tbody td{padding:13px 12px;border-bottom:1px solid var(--line);}
tbody tr:hover{background:#fff8fa;}
.pill{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.pill.stok-ok{background:#e4f7ee;color:var(--good);}
.pill.stok-low{background:#fdefe0;color:var(--warn);}
.row-actions button{border:none;background:none;font-size:15px;padding:4px 7px;border-radius:8px;transition:.15s;}
.row-actions button:hover{background:var(--pink-soft);}
.prod-thumb{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--pink-soft),#fff);display:inline-flex;align-items:center;justify-content:center;font-size:16px;margin-right:8px;vertical-align:middle;}

/* laporan */
.tabs{display:flex;gap:8px;margin-bottom:20px;}
.tab-btn{padding:9px 18px;border-radius:30px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--muted);transition:.18s;display:inline-block;}
.tab-btn.active{background:var(--maroon);border-color:var(--maroon);color:#fff;}
.chart-wrap{display:flex;align-items:flex-end;gap:14px;height:220px;padding:10px 6px 0;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.bar{width:60%;background:linear-gradient(180deg,var(--pink),var(--maroon));border-radius:8px 8px 4px 4px;transition:height .8s cubic-bezier(.2,.8,.2,1);position:relative;}
.bar-val{font-size:10.5px;font-weight:700;color:var(--maroon-dark);margin-bottom:6px;}
.bar-lbl{font-size:11px;color:var(--muted);margin-top:8px;}
.laporan-total{display:flex;gap:24px;margin-top:22px;flex-wrap:wrap;}
.laporan-total .box{background:var(--pink-soft);border-radius:14px;padding:14px 20px;flex:1;min-width:150px;}
.laporan-total .box .n{font-size:20px;font-weight:700;color:var(--maroon-dark);}
.laporan-total .box .l{font-size:11.5px;color:var(--maroon-dark);opacity:.75;}

/* toast */
#toast{
  position:fixed;bottom:96px;right:26px;background:var(--maroon-dark);color:#fff;
  padding:13px 20px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px;transform:translateY(120%);opacity:0;
  transition:.35s cubic-bezier(.2,.8,.2,1);z-index:999;max-width:80vw;
}
#toast.show{transform:translateY(0);opacity:1;}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(45,10,26,.45);display:none;align-items:center;justify-content:center;z-index:998;padding:20px;}
.overlay.show{display:flex;}
.modal{background:#fff;border-radius:18px;padding:26px;max-width:340px;width:100%;text-align:center;box-shadow:var(--shadow);animation:riseIn .3s ease;}
.modal h3{margin-top:0;color:var(--maroon-dark);}
.modal p{font-size:13.5px;color:var(--muted);}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions button{flex:1;padding:10px;border-radius:10px;border:none;font-size:13px;font-weight:600;}
.btn-cancel{background:var(--pink-soft);color:var(--maroon-dark);}
.btn-danger{background:#e0295f;color:#fff;}

@media(max-width:820px){
  .main{padding:80px 16px 92px;}
  .form-grid{grid-template-columns:1fr;}
  .bn-item{min-width:56px;font-size:9.5px;padding:6px 8px;}
}

</style>
</head>
<body>

<!-- TOP HEADER -->
<div class="top-header">
  <div>
    <div class="th-brand">Admin Toko Pink<span>Aura</span></div>
    <div class="th-role">Panel Kelola Produk & Laporan</div>
  </div>
  <button class="logout-icon" onclick="doLogout()" title="Logout">⎋</button>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <a class="bn-item active" href="dashboard.html"><span class="bn-icon">🏠</span><span>Dashboard</span></a>
  <a class="bn-item" href="inputbarang.html"><span class="bn-icon">➕</span><span>Input</span></a>
  <a class="bn-item" href="lihat.html"><span class="bn-icon">📦</span><span>Barang</span></a>
  <a class="bn-item" href="laporanhari.html"><span class="bn-icon">📊</span><span>Laporan</span></a>
</div>

<div class="main">
  <div class="topbar">
    <div>
      <h1>Dashboard</h1>
      <div class="date" id="pageDate"></div>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="icon">📦</div>
      <div class="num" id="statProduk">0</div>
      <div class="lbl">Total Produk</div>
    </div>
    <div class="stat-card">
      <div class="icon">🧮</div>
      <div class="num" id="statStok">0</div>
      <div class="lbl">Total Stok</div>
    </div>
    <div class="stat-card">
      <div class="icon">💰</div>
      <div class="num" id="statPendapatan">Rp 0</div>
      <div class="lbl">Pendapatan Hari Ini</div>
      <div class="trend up">▲ 12% dari kemarin</div>
    </div>
    <div class="stat-card">
      <div class="icon">🔥</div>
      <div class="num" id="statTerlaris">-</div>
      <div class="lbl">Produk Terlaris</div>
    </div>
  </div>

  <div class="panel">
    <h3>Aktivitas Terbaru</h3>
    <div id="activityList"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script>
requireAuth();

const d = new Date();
document.getElementById('pageDate').textContent = d.toLocaleDateString('id-ID', {weekday:'long', year:'numeric', month:'long', day:'numeric'});

const products = getProducts();
const activity = getActivity();

const totalProduk = products.length;
const totalStok = products.reduce((s,p)=>s+p.stok,0);
const pendapatanHariIni = laporanData.harian.values[laporanData.harian.values.length-1];
const terlaris = products.slice().sort((a,b)=>b.terjual-a.terjual)[0];

animateCount(document.getElementById('statProduk'), totalProduk, false);
animateCount(document.getElementById('statStok'), totalStok, false);
animateCount(document.getElementById('statPendapatan'), pendapatanHariIni, true);
document.getElementById('statTerlaris').textContent = terlaris ? terlaris.nama : '-';

document.getElementById('activityList').innerHTML = activity.slice(0,6).map(a=>`
  <div class="activity-row">
    <span>${a.text}</span>
    <span class="tag">${a.tag}</span>
  </div>`).join('') || '<p style="color:var(--muted);font-size:13px;">Belum ada aktivitas.</p>';
</script>
</body>
</html>
